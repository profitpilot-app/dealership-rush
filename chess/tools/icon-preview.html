<html><body style="margin:0"><script type="module">
import * as T from 'three';import {figurine} from '/src/figures.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(1024,1024);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#142b36');const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0x333344,2));const light=new T.DirectionalLight(0xffdfae,4);light.position.set(-3,5,4);scene.add(light);const camera=new T.PerspectiveCamera(30,1,.1,50);camera.position.set(1.8,2.3,3);camera.lookAt(0,.32,0);const model=figurine({type:'p',color:'w'});model.rotation.y=.3;model.scale.setScalar(1.6);scene.add(model);for(let x=-1;x<=1;x++)for(let z=-1;z<=1;z++){const tile=new T.Mesh(new T.BoxGeometry(.55,.06,.55),new T.MeshStandardMaterial({color:(x+z)%2?0x283f49:0xd9c798,roughness:.25,metalness:.4}));tile.position.set(x*.56,-.05,z*.56);scene.add(tile);}renderer.render(scene,camera);window.ready=true;
